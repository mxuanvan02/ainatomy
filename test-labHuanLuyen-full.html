<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Debug labHuanLuyen Full</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .log { margin: 5px 0; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Debug labHuanLuyen Full</h1>
    <div id="output"></div>
    
    <script src="js/lab.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/muc3.js"></script>
    <script>
        const output = document.getElementById('output');
        function log(msg, type = '') {
            console.log(msg);
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.textContent = msg;
            output.appendChild(div);
        }
        
        // Mock dependencies
        const $ = (id) => document.getElementById(id);
        const maHS = 'TEST001';
        const pct = (x) => x===null||x===undefined ? "—" : Math.round(x*100) + "%";
        
        // Create mock elements
        ['kq-train', 'kq-ngay', 'kq-dem', 'bar-dem', 'bar-ngay', 'lab-muc3-bt06'].forEach(id => {
            const el = document.createElement('div');
            el.id = id;
            document.body.appendChild(el);
        });
        
        // Mock lab object
        const lab = {
            model: null,
            train: null,
            testNgay: null,
            testDem: null,
            kqTrain: null,
            kqNgay: null,
            kqDem: null,
            kqDemC2: null
        };
        
        const m3 = { bt03: null, bt06: null };
        
        function labBuoc(step) {
            log('labBuoc(' + step + ')');
        }
        
        // Test từng bước của labHuanLuyen
        log('=== BẮT ĐẦU TEST ===');
        
        // Bước 1: Khởi tạo dữ liệu
        log('Bước 1: Khởi tạo dữ liệu...');
        lab.train = window.MX_LAB.taoDuLieu({ soLuong: 60, lechAnhSang: true, seed: 20261006 });
        lab.testNgay = window.MX_LAB.taoDuLieu({ soLuong: 10, light: "ngay", seed: 777 });
        lab.testDem = window.MX_LAB.taoDuLieu({ soLuong: 10, light: "dem", seed: 888 });
        log('✓ Đã tạo dữ liệu: ' + lab.train.length + ' train, ' + lab.testNgay.length + ' testNgay, ' + lab.testDem.length + ' testDem');
        
        // Bước 2: Tạo model
        log('Bước 2: Tạo model Perceptron...');
        lab.model = new window.MX_LAB.Perceptron();
        log('✓ Đã tạo model');
        
        // Bước 3: Gọi hoc()
        log('Bước 3: Gọi hoc()...');
        const start = Date.now();
        lab.model.hoc({ duLieu: lab.train.map(function(d){ return { f: d.f, nhan: d.nhan }; }), vong: window.MX_LAB.EPOCHS });
        log('✓ hoc() hoàn thành trong ' + (Date.now() - start) + 'ms');
        
        // Bước 4: Kiểm tra kết quả
        log('Bước 4: Kiểm tra kết quả...');
        lab.kqTrain = window.MX_LAB.kiemTra(lab.model, lab.train);
        log('✓ kqTrain: ' + pct(lab.kqTrain.doChinhXac));
        
        lab.kqNgay = window.MX_LAB.kiemTra(lab.model, lab.testNgay);
        log('✓ kqNgay: ' + pct(lab.kqNgay.doChinhXac));
        
        lab.kqDem = window.MX_LAB.kiemTra(lab.model, lab.testDem);
        log('✓ kqDem: ' + pct(lab.kqDem.doChinhXac));
        
        // Bước 5: Cập nhật UI
        log('Bước 5: Cập nhật UI...');
        $("kq-train").textContent = pct(lab.kqTrain.doChinhXac);
        $("kq-ngay").textContent = pct(lab.kqNgay.doChinhXac);
        $("kq-dem").textContent = pct(lab.kqDem.doChinhXac);
        $("bar-dem").style.width = Math.round(lab.kqDem.doChinhXac*100)+"%";
        $("bar-ngay").style.width = Math.round(lab.kqNgay.doChinhXac*100)+"%";
        log('✓ Đã cập nhật UI');
        
        // Bước 6: Log sự kiện
        log('Bước 6: Log sự kiện...');
        window.MX_ENGINE.logSuKien(maHS, { loai:"huanLuyen", cheDo:"lech", doChinhXacTrain: lab.kqTrain.doChinhXac, ngay: lab.kqNgay.doChinhXac, dem: lab.kqDem.doChinhXac });
        log('✓ Đã log sự kiện');
        
        // Bước 7: Gọi M3
        log('Bước 7: Gọi M3...');
        if(m3.bt03 && window.MX_MUC3) {
            window.MX_MUC3.cham(m3.bt03);
            log('✓ Đã gọi M3().cham()');
        } else {
            log('⊘ Bỏ qua M3().cham()');
        }
        
        // Bước 8: labBuoc
        log('Bước 8: labBuoc(3)...');
        labBuoc(3);
        log('✓ Đã gọi labBuoc(3)');
        
        // Bước 9: Tạo BT-06
        log('Bước 9: Tạo BT-06...');
        m3.bt06 = window.MX_MUC3 ? window.MX_MUC3.mo("BT-06", $("lab-muc3-bt06"), function() {
            return { so: lab.kqDemC2 ? lab.kqDemC2.doChinhXac : null };
        }) : null;
        log('✓ Đã tạo BT-06');
        
        log('=== HOÀN TẤT ===', 'success');
    </script>
</body>
</html>
